<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADO Epic Tree</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #1a1b1e;
  --surface: #25262b;
  --surface-hover: #2c2e33;
  --border: #373a40;
  --text: #c1c2c5;
  --text-muted: #909296;
  --text-bright: #e9ecef;
  --accent: #4c6ef5;
  --accent-hover: #5c7cfa;
  --epic: #cc5de8;
  --feature: #339af0;
  --userstory: #51cf66;
  --bug: #ff6b6b;
  --success: #51cf66;
  --warning: #fcc419;
  --danger: #ff6b6b;
  --radius: 6px;
  --radius-sm: 4px;
  --font: 'Segoe UI', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --font-mono: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace;
}

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
}

header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}

header h1 {
  font-size: 18px;
  font-weight: 600;
  color: var(--text-bright);
  letter-spacing: -0.3px;
}

.toolbar {
  padding: 10px 24px;
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}

.btn {
  font-family: var(--font);
  font-size: 12px;
  font-weight: 600;
  padding: 5px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text);
  cursor: pointer;
  transition: all 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
}
.btn:hover { background: var(--surface-hover); }

.search-input {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-bright);
  padding: 6px 12px;
  font-size: 13px;
  font-family: var(--font);
  outline: none;
  min-width: 220px;
}
.search-input:focus { border-color: var(--accent); }
.search-input::placeholder { color: var(--text-muted); }

.summary {
  padding: 10px 24px;
  display: flex;
  gap: 20px;
  font-size: 13px;
  color: var(--text-muted);
  flex-wrap: wrap;
}
.summary strong { color: var(--text-bright); }
.summary .count { font-weight: 700; }

.tree-container {
  padding: 16px 24px 40px;
  overflow-x: auto;
  min-height: 300px;
}

.tree-node { user-select: none; }

.tree-row {
  display: flex;
  align-items: center;
  padding: 5px 8px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  gap: 6px;
  transition: background 0.10s;
  min-width: max-content;
}
.tree-row:hover { background: var(--surface-hover); }

.toggle-icon {
  width: 18px;
  height: 18px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  color: var(--text-muted);
  font-size: 10px;
  transition: transform 0.15s;
  border-radius: 3px;
}
.toggle-icon:hover { background: var(--border); }
.toggle-icon.expanded { transform: rotate(90deg); }
.toggle-icon.leaf { visibility: hidden; }

.type-badge {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  padding: 2px 7px;
  border-radius: 3px;
  flex-shrink: 0;
  min-width: 22px;
  text-align: center;
}
.type-epic     { background: rgba(204,93,232,0.18); color: var(--epic); }
.type-feature  { background: rgba(51,154,240,0.18); color: var(--feature); }
.type-user-story { background: rgba(81,207,102,0.18); color: var(--userstory); }
.type-bug      { background: rgba(255,107,107,0.18); color: var(--bug); }

.wi-id {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-muted);
  flex-shrink: 0;
  min-width: 48px;
}

.wi-title {
  font-size: 13px;
  color: var(--text-bright);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}

.state-badge {
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 3px;
  font-weight: 600;
  flex-shrink: 0;
  white-space: nowrap;
}
.state-active, .state-new, .state-proposed, .state-inprogress, .state-in-progress, .state-committed,
.state-to-do, .state-todo, .state-doing {
  background: rgba(81,207,102,0.12); color: var(--success);
}
.state-resolved {
  background: rgba(252,196,25,0.12); color: var(--warning);
}
.state-closed, .state-done, .state-removed {
  background: rgba(144,146,150,0.12); color: var(--text-muted);
}

.assigned-to {
  font-size: 12px;
  color: var(--text-muted);
  flex-shrink: 0;
  max-width: 140px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.child-count {
  font-size: 11px;
  color: var(--text-muted);
  flex-shrink: 0;
}

.children { overflow: hidden; }
.children.collapsed { display: none; }

.ado-link {
  color: var(--accent);
  text-decoration: none;
  font-size: 12px;
  flex-shrink: 0;
  opacity: 0;
  transition: opacity 0.10s;
}
.tree-row:hover .ado-link { opacity: 1; }
.ado-link:hover { text-decoration: underline; }

.empty-state {
  text-align: center;
  padding: 60px 24px;
  color: var(--text-muted);
  font-size: 14px;
}
.empty-state p { margin-top: 8px; }
.empty-state code {
  background: var(--surface);
  padding: 2px 6px;
  border-radius: 3px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-bright);
}

.file-loader {
  text-align: center;
  padding: 60px 24px;
  color: var(--text-muted);
}
.file-loader input { display: none; }
.file-loader label {
  display: inline-block;
  padding: 10px 24px;
  background: var(--accent);
  color: #fff;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: background 0.15s;
}
.file-loader label:hover { background: var(--accent-hover); }
.file-loader .hint {
  margin-top: 12px;
  font-size: 12px;
  color: var(--text-muted);
}

@media (max-width: 768px) {
  header { padding: 12px 16px; }
  .toolbar { padding: 10px 16px; }
  .tree-container { padding: 12px 16px 32px; }
  .assigned-to { display: none; }
  .child-count { display: none; }
  .search-input { min-width: 150px; }
}
</style>
</head>
<body>

<header>
  <h1>ADO Epic Tree &mdash; Non-Closed Epics</h1>
  <span id="exportTimestamp" style="font-size:11px;color:var(--text-muted)"></span>
</header>

<div class="toolbar" id="toolbar" style="display:none">
  <button class="btn" onclick="expandAll()">Expand All</button>
  <button class="btn" onclick="collapseAll()">Collapse All</button>
  <input type="text" class="search-input" id="searchInput" placeholder="Filter by title..." oninput="renderTree()">
  <span style="flex:1"></span>
  <label class="btn" title="Load epic_tree.json from exports folder">
    <input type="file" id="fileInput" accept=".json" onchange="loadFromFile(event)" hidden>
    Load file...
  </label>
</div>

<div class="summary" id="summary" style="display:none">
  <span>Epics: <strong class="count" id="epicCount">0</strong></span>
  <span>Features: <strong class="count" id="featureCount">0</strong></span>
  <span>User Stories: <strong class="count" id="storyCount">0</strong></span>
  <span>Bugs: <strong class="count" id="bugCount">0</strong></span>
</div>

<div class="tree-container" id="treeContainer">
  <div class="file-loader" id="fileLoader">
    <label for="fileInput">Load epic_tree.json</label>
    <div class="hint">Run <code>python release_notes/epic_tree_export.py</code> first, then load the generated JSON file.</div>
    <div class="hint" style="margin-top:4px">Or run with <code>--mock</code> for demo data.</div>
  </div>
  <div id="emptyState" class="empty-state" style="display:none">
    <p>No Epics found or the dataset is empty.</p>
  </div>
</div>

<script>
window.EPIC_TREE_DATA = [];

(function() {
  var data = window.EPIC_TREE_DATA;

  if (Array.isArray(data) && data.length > 0) {
    init(data);
    return;
  }

  // Try to load exports/epic_tree.json
  fetch('exports/epic_tree.json')
    .then(function(r) { if (!r.ok) throw new Error('not found'); return r.json(); })
    .then(function(tree) {
      if (Array.isArray(tree) && tree.length > 0) {
        init(tree);
      }
    })
    .catch(function() {
      // Show file loader UI (already visible)
    });

  function init(treeData) {
    document.getElementById('fileLoader').style.display = 'none';
    window.EPIC_TREE_DATA = treeData;
    document.getElementById('toolbar').style.display = 'flex';
    document.getElementById('summary').style.display = 'flex';
    updateSummary();
    renderTree();
  }

  var LINK_HIERARCHY_FORWARD = 'System.LinkTypes.Hierarchy-Forward';

  function updateSummary() {
    var epics = 0, features = 0, stories = 0, bugs = 0;
    function count(n) {
      var t = n.type.toLowerCase();
      if (t === 'epic') epics++;
      else if (t === 'feature') features++;
      else if (t === 'user story') stories++;
      else if (t === 'bug') bugs++;
      (n.children || []).forEach(count);
    }
    (window.EPIC_TREE_DATA || []).forEach(count);
    document.getElementById('epicCount').textContent = epics;
    document.getElementById('featureCount').textContent = features;
    document.getElementById('storyCount').textContent = stories;
    document.getElementById('bugCount').textContent = bugs;
  }

  function renderTree() {
    var container = document.getElementById('treeContainer');
    var existing = container.querySelectorAll('.tree-node');
    for (var i = 0; i < existing.length; i++) existing[i].remove();
    document.getElementById('emptyState').style.display = 'none';

    var search = (document.getElementById('searchInput').value || '').toLowerCase().trim();

    function nodeMatches(node) {
      if (!search) return true;
      if (node.title.toLowerCase().indexOf(search) !== -1) return true;
      if (('#' + node.id).indexOf(search) !== -1) return true;
      if (node.state.toLowerCase().indexOf(search) !== -1) return true;
      return (node.children || []).some(nodeMatches);
    }

    var visibleCount = 0;
    (window.EPIC_TREE_DATA || []).forEach(function(epic) {
      if (!nodeMatches(epic)) return;
      visibleCount++;
      container.appendChild(createNodeElement(epic, 0, search));
    });

    if (visibleCount === 0) {
      var msg = search ? 'No items match your filter.' : 'No data to display.';
      var el = document.getElementById('emptyState');
      el.querySelector('p').textContent = msg;
      el.style.display = '';
    }
  }

  function createNodeElement(node, depth, search) {
    var div = document.createElement('div');
    div.className = 'tree-node';

    var hasChildren = node.children && node.children.length > 0;

    var row = document.createElement('div');
    row.className = 'tree-row';
    row.style.paddingLeft = (8 + depth * 20) + 'px';

    var toggle = document.createElement('span');
    toggle.className = 'toggle-icon' + (hasChildren ? ' expanded' : ' leaf');
    toggle.textContent = hasChildren ? '\u25B6' : '';
    if (hasChildren) {
      toggle.onclick = function(e) {
        e.stopPropagation();
        toggleChildren(div);
      };
    }
    row.appendChild(toggle);

    var badge = document.createElement('span');
    var typeKey = node.type.toLowerCase().replace(/\s+/g, '-');
    badge.className = 'type-badge type-' + typeKey;
    var badges = { 'epic': 'E', 'feature': 'F', 'user-story': 'US', 'bug': 'B' };
    badge.textContent = badges[typeKey] || node.type[0];
    badge.title = node.type;
    row.appendChild(badge);

    var idEl = document.createElement('span');
    idEl.className = 'wi-id';
    idEl.textContent = '#' + node.id;
    row.appendChild(idEl);

    var titleEl = document.createElement('span');
    titleEl.className = 'wi-title';
    titleEl.textContent = node.title;
    row.appendChild(titleEl);

    var stateEl = document.createElement('span');
    var stateKey = 'state-' + node.state.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z-]/g, '');
    stateEl.className = 'state-badge ' + stateKey;
    stateEl.textContent = node.state;
    row.appendChild(stateEl);

    if (node.assignedTo) {
      var assignedEl = document.createElement('span');
      assignedEl.className = 'assigned-to';
      assignedEl.textContent = node.assignedTo;
      assignedEl.title = node.assignedTo;
      row.appendChild(assignedEl);
    }

    if (hasChildren) {
      var countEl = document.createElement('span');
      countEl.className = 'child-count';
      var parts = [];
      var cs = node.childStats || {};
      if (cs.features > 0) parts.push(cs.features + 'F');
      if (cs.stories > 0) parts.push(cs.stories + 'US');
      if (cs.bugs > 0) parts.push(cs.bugs + 'B');
      countEl.textContent = parts.length ? '(' + parts.join(' ') + ')' : '(' + node.children.length + ')';
      row.appendChild(countEl);
    }

    if (node.url) {
      var link = document.createElement('a');
      link.className = 'ado-link';
      link.href = node.url;
      link.target = '_blank';
      link.rel = 'noopener';
      link.textContent = 'Open';
      link.title = 'Open in Azure DevOps';
      link.onclick = function(e) { e.stopPropagation(); };
      row.appendChild(link);
    }

    div.appendChild(row);

    if (hasChildren) {
      var childrenDiv = document.createElement('div');
      childrenDiv.className = 'children expanded';
      node.children.forEach(function(child) {
        childrenDiv.appendChild(createNodeElement(child, depth + 1, search));
      });
      div.appendChild(childrenDiv);
    }

    return div;
  }

  function toggleChildren(nodeEl) {
    var childrenDiv = nodeEl.querySelector('.children');
    var toggle = nodeEl.querySelector('.toggle-icon');
    if (!childrenDiv) return;
    if (childrenDiv.classList.contains('expanded')) {
      childrenDiv.classList.remove('expanded');
      childrenDiv.classList.add('collapsed');
      toggle.classList.remove('expanded');
    } else {
      childrenDiv.classList.remove('collapsed');
      childrenDiv.classList.add('expanded');
      toggle.classList.add('expanded');
    }
  }

  window.expandAll = function() {
    var all = document.querySelectorAll('.children');
    for (var i = 0; i < all.length; i++) {
      all[i].classList.remove('collapsed');
      all[i].classList.add('expanded');
    }
    var toggles = document.querySelectorAll('.toggle-icon:not(.leaf)');
    for (var j = 0; j < toggles.length; j++) toggles[j].classList.add('expanded');
  };

  window.collapseAll = function() {
    var all = document.querySelectorAll('.children');
    for (var i = 0; i < all.length; i++) {
      all[i].classList.remove('expanded');
      all[i].classList.add('collapsed');
    }
    var toggles = document.querySelectorAll('.toggle-icon:not(.leaf)');
    for (var j = 0; j < toggles.length; j++) toggles[j].classList.remove('expanded');
  };

  window.loadFromFile = function(event) {
    var file = event.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
      try {
        var tree = JSON.parse(e.target.result);
        if (!Array.isArray(tree)) throw new Error('Invalid format');
        window.EPIC_TREE_DATA = tree;
        document.getElementById('fileLoader').style.display = 'none';
        document.getElementById('toolbar').style.display = 'flex';
        document.getElementById('summary').style.display = 'flex';
        updateSummary();
        renderTree();
      } catch (err) {
        alert('Failed to parse JSON: ' + err.message);
      }
    };
    reader.readAsText(file);
  };

})();
</script>

</body>
</html>
