<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADO Epic Tree</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #1a1b1e;
  --surface: #25262b;
  --surface-hover: #2c2e33;
  --border: #373a40;
  --text: #c1c2c5;
  --text-muted: #909296;
  --text-bright: #e9ecef;
  --accent: #4c6ef5;
  --accent-hover: #5c7cfa;
  --epic: #cc5de8;
  --feature: #339af0;
  --userstory: #51cf66;
  --bug: #ff6b6b;
  --success: #51cf66;
  --warning: #fcc419;
  --danger: #ff6b6b;
  --radius: 6px;
  --radius-sm: 4px;
  --font: 'Segoe UI', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --font-mono: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace;
}

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
}

header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}

header h1 {
  font-size: 18px;
  font-weight: 600;
  color: var(--text-bright);
  letter-spacing: -0.3px;
}

.toolbar {
  padding: 10px 24px;
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}

.btn {
  font-family: var(--font);
  font-size: 12px;
  font-weight: 600;
  padding: 5px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text);
  cursor: pointer;
  transition: all 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
}
.btn:hover { background: var(--surface-hover); }

.view-toggle {
  display: flex;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  overflow: hidden;
}
.view-toggle .btn {
  border: none;
  border-radius: 0;
  padding: 4px 14px;
  font-size: 11px;
}
.view-toggle .btn:not(:last-child) { border-right: 1px solid var(--border); }
.view-toggle .btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.search-input {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-bright);
  padding: 6px 12px;
  font-size: 13px;
  font-family: var(--font);
  outline: none;
  min-width: 220px;
}
.search-input:focus { border-color: var(--accent); }
.search-input::placeholder { color: var(--text-muted); }

.summary {
  padding: 10px 24px;
  display: flex;
  gap: 20px;
  font-size: 13px;
  color: var(--text-muted);
  flex-wrap: wrap;
}
.summary strong { color: var(--text-bright); }
.summary .count { font-weight: 700; }

.tree-container {
  padding: 16px 24px 40px;
  overflow-x: auto;
  min-height: 300px;
}
.tree-container.graph { padding: 24px; position: relative; }
.tree-container.hidden { display: none; }

.tree-node { user-select: none; }

.tree-row {
  display: flex;
  align-items: center;
  padding: 5px 8px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  gap: 6px;
  transition: background 0.10s;
  min-width: max-content;
}
.tree-row:hover { background: var(--surface-hover); }

.toggle-icon {
  width: 18px;
  height: 18px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  color: var(--text-muted);
  font-size: 10px;
  transition: transform 0.15s;
  border-radius: 3px;
}
.toggle-icon:hover { background: var(--border); }
.toggle-icon.expanded { transform: rotate(90deg); }
.toggle-icon.leaf { visibility: hidden; }

.type-badge {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  padding: 2px 7px;
  border-radius: 3px;
  flex-shrink: 0;
  min-width: 22px;
  text-align: center;
}
.type-epic     { background: rgba(204,93,232,0.18); color: var(--epic); }
.type-feature  { background: rgba(51,154,240,0.18); color: var(--feature); }
.type-user-story { background: rgba(81,207,102,0.18); color: var(--userstory); }
.type-bug      { background: rgba(255,107,107,0.18); color: var(--bug); }

.wi-id {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-muted);
  flex-shrink: 0;
  min-width: 48px;
}

.wi-title {
  font-size: 13px;
  color: var(--text-bright);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}

.state-badge {
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 3px;
  font-weight: 600;
  flex-shrink: 0;
  white-space: nowrap;
}
.state-active, .state-new, .state-proposed, .state-inprogress, .state-in-progress, .state-committed,
.state-to-do, .state-todo, .state-doing {
  background: rgba(81,207,102,0.12); color: var(--success);
}
.state-resolved {
  background: rgba(252,196,25,0.12); color: var(--warning);
}
.state-closed, .state-done, .state-removed {
  background: rgba(144,146,150,0.12); color: var(--text-muted);
}

.assigned-to {
  font-size: 12px;
  color: var(--text-muted);
  flex-shrink: 0;
  max-width: 140px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.child-count {
  font-size: 11px;
  color: var(--text-muted);
  flex-shrink: 0;
}

.children { overflow: hidden; }
.children.collapsed { display: none; }

.ado-link {
  color: var(--accent);
  text-decoration: none;
  font-size: 12px;
  flex-shrink: 0;
  opacity: 0;
  transition: opacity 0.10s;
}
.tree-row:hover .ado-link { opacity: 1; }
.ado-link:hover { text-decoration: underline; }

.empty-state {
  text-align: center;
  padding: 60px 24px;
  color: var(--text-muted);
  font-size: 14px;
}
.empty-state p { margin-top: 8px; }
.empty-state code {
  background: var(--surface);
  padding: 2px 6px;
  border-radius: 3px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-bright);
}

.file-loader {
  text-align: center;
  padding: 60px 24px;
  color: var(--text-muted);
}
.file-loader input { display: none; }
.file-loader label {
  display: inline-block;
  padding: 10px 24px;
  background: var(--accent);
  color: #fff;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: background 0.15s;
}
.file-loader label:hover { background: var(--accent-hover); }
.file-loader .hint {
  margin-top: 12px;
  font-size: 12px;
  color: var(--text-muted);
}

/* Graph view */
.graph-canvas {
  position: relative;
  min-width: 100%;
}
.graph-svg {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
}
.graph-svg line {
  stroke: var(--border);
  stroke-width: 1.5;
}
.graph-svg line.edge-epic-feature { stroke: rgba(204,93,232,0.25); }
.graph-svg line.edge-epic-leaf { stroke: rgba(204,93,232,0.18); }
.graph-svg line.edge-feature-leaf { stroke: rgba(51,154,240,0.20); }

.graph-columns {
  display: flex;
  gap: 0;
  position: relative;
  z-index: 1;
  min-width: max-content;
}

.graph-col {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 0 16px;
  min-width: 260px;
}
.graph-col-header {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--text-muted);
  padding: 4px 8px 8px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 4px;
}

.graph-node {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 8px 10px;
  cursor: pointer;
  transition: background 0.10s, border-color 0.10s;
  position: relative;
  z-index: 1;
  min-width: 240px;
}
.graph-node:hover { background: var(--surface-hover); border-color: var(--accent); }
.graph-node.epic   { border-left: 3px solid var(--epic); }
.graph-node.feature { border-left: 3px solid var(--feature); }
.graph-node.leaf   { border-left: 3px solid var(--userstory); }
.graph-node.leaf.bug-node { border-left-color: var(--bug); }

.graph-node-header {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 2px;
}
.graph-node-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-bright);
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.graph-node-footer {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 4px;
  font-size: 11px;
}
.graph-node-footer .state-badge { font-size: 9px; padding: 1px 6px; }
.graph-node-footer .graph-link {
  color: var(--accent);
  text-decoration: none;
  font-size: 10px;
  margin-left: auto;
  opacity: 0;
  transition: opacity 0.10s;
}
.graph-node:hover .graph-link { opacity: 1; }
.graph-node-footer .graph-link:hover { text-decoration: underline; }

.connector-label {
  position: absolute;
  font-size: 9px;
  color: var(--text-muted);
  background: var(--bg);
  padding: 1px 4px;
  border-radius: 2px;
  white-space: nowrap;
  z-index: 2;
}

.legend {
  padding: 2px 24px 0;
  display: flex;
  gap: 16px;
  font-size: 11px;
  color: var(--text-muted);
  align-items: center;
}
.legend span { display: flex; align-items: center; gap: 4px; }
.legend .swatch {
  width: 10px; height: 10px;
  border-radius: 2px;
  display: inline-block;
}
.legend .swatch.epic { background: var(--epic); }
.legend .swatch.feature { background: var(--feature); }
.legend .swatch.story { background: var(--userstory); }
.legend .swatch.bug { background: var(--bug); }

@media (max-width: 768px) {
  header { padding: 12px 16px; }
  .toolbar { padding: 10px 16px; }
  .tree-container { padding: 12px 16px 32px; }
  .assigned-to { display: none; }
  .child-count { display: none; }
  .search-input { min-width: 150px; }
  .graph-col { min-width: 200px; }
  .graph-node { min-width: 180px; }
}
</style>
</head>
<body>

<header>
  <h1>ADO Epic Tree &mdash; Non-Closed Epics</h1>
  <span id="exportTimestamp" style="font-size:11px;color:var(--text-muted)"></span>
</header>

<div class="toolbar" id="toolbar" style="display:none">
  <div class="view-toggle" id="viewToggle">
    <button class="btn active" data-view="tree">Tree</button>
    <button class="btn" data-view="graph">Graph</button>
  </div>
  <button class="btn tree-only" onclick="expandAll()">Expand All</button>
  <button class="btn tree-only" onclick="collapseAll()">Collapse All</button>
  <input type="text" class="search-input" id="searchInput" placeholder="Filter by title..." oninput="onSearch()">
  <span style="flex:1"></span>
  <label class="btn" title="Load epic_tree.json from exports folder">
    <input type="file" id="fileInput" accept=".json" onchange="loadFromFile(event)" hidden>
    Load file...
  </label>
</div>

<div class="summary" id="summary" style="display:none">
  <span>Epics: <strong class="count" id="epicCount">0</strong></span>
  <span>Features: <strong class="count" id="featureCount">0</strong></span>
  <span>User Stories: <strong class="count" id="storyCount">0</strong></span>
  <span>Bugs: <strong class="count" id="bugCount">0</strong></span>
</div>

<div class="legend" id="legend" style="display:none">
  <span><span class="swatch epic"></span> Epic</span>
  <span><span class="swatch feature"></span> Feature</span>
  <span><span class="swatch story"></span> User Story</span>
  <span><span class="swatch bug"></span> Bug</span>
</div>

<div class="tree-container" id="treeContainer">
  <div class="file-loader" id="fileLoader">
    <label for="fileInput">Load epic_tree.json</label>
    <div class="hint">Run <code>python release_notes/epic_tree_export.py</code> first, then load the generated JSON file.</div>
    <div class="hint" style="margin-top:4px">Or run with <code>--mock</code> for demo data.</div>
  </div>
  <div id="emptyState" class="empty-state" style="display:none">
    <p>No Epics found or the dataset is empty.</p>
  </div>
</div>

<script>
window.EPIC_TREE_DATA = [];

(function() {
  var data = window.EPIC_TREE_DATA;
  var currentView = 'tree';

  if (Array.isArray(data) && data.length > 0) {
    init(data);
    return;
  }

  if (window.location.protocol === 'file:') {
    document.getElementById('fileLoader').querySelector('.hint').textContent =
      'Browsers block file:// fetches. Use the \u201CLoad file...\u201D button above to open your epic_tree.json.';
    return;
  }

  fetch('exports/epic_tree.json')
    .then(function(r) { if (!r.ok) throw new Error('not found'); return r.json(); })
    .then(function(tree) {
      if (Array.isArray(tree) && tree.length > 0) {
        init(tree);
      }
    })
    .catch(function() {
    });

  function init(treeData) {
    document.getElementById('fileLoader').style.display = 'none';
    window.EPIC_TREE_DATA = treeData;
    document.getElementById('toolbar').style.display = 'flex';
    document.getElementById('summary').style.display = 'flex';
    document.getElementById('legend').style.display = 'flex';
    setupViewToggle();
    updateSummary();
    renderCurrentView();
  }

  function setupViewToggle() {
    var buttons = document.querySelectorAll('#viewToggle .btn');
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].addEventListener('click', function(e) {
        var view = this.getAttribute('data-view');
        if (view === currentView) return;
        currentView = view;
        var all = document.querySelectorAll('#viewToggle .btn');
        for (var j = 0; j < all.length; j++) {
          all[j].classList.toggle('active', all[j].getAttribute('data-view') === view);
        }
        var treeOnly = document.querySelectorAll('.tree-only');
        for (var k = 0; k < treeOnly.length; k++) {
          treeOnly[k].style.display = view === 'tree' ? '' : 'none';
        }
        renderCurrentView();
      });
    }
  }

  function onSearch() {
    renderCurrentView();
  }

  function renderCurrentView() {
    if (currentView === 'graph') {
      renderGraph();
    } else {
      renderTree();
    }
  }

  // ── Summary ──────────────────────────────────────────────

  function updateSummary() {
    var epics = 0, features = 0, stories = 0, bugs = 0;
    function count(n) {
      var t = n.type.toLowerCase();
      if (t === 'epic') epics++;
      else if (t === 'feature') features++;
      else if (t === 'user story') stories++;
      else if (t === 'bug') bugs++;
      (n.children || []).forEach(count);
    }
    (window.EPIC_TREE_DATA || []).forEach(count);
    document.getElementById('epicCount').textContent = epics;
    document.getElementById('featureCount').textContent = features;
    document.getElementById('storyCount').textContent = stories;
    document.getElementById('bugCount').textContent = bugs;
  }

  // ── Tree view ────────────────────────────────────────────

  function renderTree() {
    var container = document.getElementById('treeContainer');
    container.className = 'tree-container';
    container.innerHTML = '';
    document.getElementById('emptyState').style.display = 'none';

    var search = getSearch();

    function nodeMatches(node) {
      if (!search) return true;
      if (node.title.toLowerCase().indexOf(search) !== -1) return true;
      if (('#' + node.id).indexOf(search) !== -1) return true;
      if (node.state.toLowerCase().indexOf(search) !== -1) return true;
      return (node.children || []).some(nodeMatches);
    }

    var visibleCount = 0;
    (window.EPIC_TREE_DATA || []).forEach(function(epic) {
      if (!nodeMatches(epic)) return;
      visibleCount++;
      container.appendChild(createNodeElement(epic, 0, search));
    });

    if (visibleCount === 0) {
      var msg = search ? 'No items match your filter.' : 'No data to display.';
      var emptyEl = document.createElement('div');
      emptyEl.id = 'emptyState';
      emptyEl.className = 'empty-state';
      emptyEl.style.display = '';
      emptyEl.innerHTML = '<p>' + escapeHtml(msg) + '</p>';
      container.appendChild(emptyEl);
    }
  }

  function createNodeElement(node, depth, search) {
    var div = document.createElement('div');
    div.className = 'tree-node';

    var hasChildren = node.children && node.children.length > 0;

    var row = document.createElement('div');
    row.className = 'tree-row';
    row.style.paddingLeft = (8 + depth * 20) + 'px';

    var toggle = document.createElement('span');
    toggle.className = 'toggle-icon' + (hasChildren ? ' expanded' : ' leaf');
    toggle.textContent = hasChildren ? '\u25B6' : '';
    if (hasChildren) {
      toggle.onclick = function(e) {
        e.stopPropagation();
        toggleChildren(div);
      };
    }
    row.appendChild(toggle);

    var badge = document.createElement('span');
    var typeKey = node.type.toLowerCase().replace(/\s+/g, '-');
    badge.className = 'type-badge type-' + typeKey;
    var badges = { 'epic': 'E', 'feature': 'F', 'user-story': 'US', 'bug': 'B' };
    badge.textContent = badges[typeKey] || node.type[0];
    badge.title = node.type;
    row.appendChild(badge);

    var idEl = document.createElement('span');
    idEl.className = 'wi-id';
    idEl.textContent = '#' + node.id;
    row.appendChild(idEl);

    var titleEl = document.createElement('span');
    titleEl.className = 'wi-title';
    titleEl.textContent = node.title;
    row.appendChild(titleEl);

    var stateEl = document.createElement('span');
    var stateKey = 'state-' + node.state.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z-]/g, '');
    stateEl.className = 'state-badge ' + stateKey;
    stateEl.textContent = node.state;
    row.appendChild(stateEl);

    if (node.assignedTo) {
      var assignedEl = document.createElement('span');
      assignedEl.className = 'assigned-to';
      assignedEl.textContent = node.assignedTo;
      assignedEl.title = node.assignedTo;
      row.appendChild(assignedEl);
    }

    if (hasChildren) {
      var countEl = document.createElement('span');
      countEl.className = 'child-count';
      var parts = [];
      var cs = node.childStats || {};
      if (cs.features > 0) parts.push(cs.features + 'F');
      if (cs.stories > 0) parts.push(cs.stories + 'US');
      if (cs.bugs > 0) parts.push(cs.bugs + 'B');
      countEl.textContent = parts.length ? '(' + parts.join(' ') + ')' : '(' + node.children.length + ')';
      row.appendChild(countEl);
    }

    if (node.url) {
      var link = document.createElement('a');
      link.className = 'ado-link';
      link.href = node.url;
      link.target = '_blank';
      link.rel = 'noopener';
      link.textContent = 'Open';
      link.title = 'Open in Azure DevOps';
      link.onclick = function(e) { e.stopPropagation(); };
      row.appendChild(link);
    }

    div.appendChild(row);

    if (hasChildren) {
      var childrenDiv = document.createElement('div');
      childrenDiv.className = 'children expanded';
      node.children.forEach(function(child) {
        childrenDiv.appendChild(createNodeElement(child, depth + 1, search));
      });
      div.appendChild(childrenDiv);
    }

    return div;
  }

  function toggleChildren(nodeEl) {
    var childrenDiv = nodeEl.querySelector('.children');
    var toggle = nodeEl.querySelector('.toggle-icon');
    if (!childrenDiv) return;
    if (childrenDiv.classList.contains('expanded')) {
      childrenDiv.classList.remove('expanded');
      childrenDiv.classList.add('collapsed');
      toggle.classList.remove('expanded');
    } else {
      childrenDiv.classList.remove('collapsed');
      childrenDiv.classList.add('expanded');
      toggle.classList.add('expanded');
    }
  }

  window.expandAll = function() {
    var all = document.querySelectorAll('.children');
    for (var i = 0; i < all.length; i++) {
      all[i].classList.remove('collapsed');
      all[i].classList.add('expanded');
    }
    var toggles = document.querySelectorAll('.toggle-icon:not(.leaf)');
    for (var j = 0; j < toggles.length; j++) toggles[j].classList.add('expanded');
  };

  window.collapseAll = function() {
    var all = document.querySelectorAll('.children');
    for (var i = 0; i < all.length; i++) {
      all[i].classList.remove('expanded');
      all[i].classList.add('collapsed');
    }
    var toggles = document.querySelectorAll('.toggle-icon:not(.leaf)');
    for (var j = 0; j < toggles.length; j++) toggles[j].classList.remove('expanded');
  };

  // ── Graph view ───────────────────────────────────────────

  var COL_GAP = 60;
  var NODE_HEIGHT = 58;
  var NODE_GAP = 10;
  var PAD_TOP = 8;
  var PAD_LEFT = 16;

  function renderGraph() {
    var search = getSearch();
    var container = document.getElementById('treeContainer');
    container.className = 'tree-container graph';
    container.innerHTML = '';

    var allNodes = [];
    var edges = [];
    var idToNode = {};

    // Flatten tree with level info, filter by search
    function flatten(nodes, parentId, level, parentType) {
      nodes.forEach(function(node) {
        var typeKey = node.type.toLowerCase().replace(/\s+/g, '-');
        var matches = nodeMatchesSearch(node, search);
        var childMatches = (node.children || []).some(function(c) { return nodeMatchesSearch(c, search); });

        if (!matches && !childMatches) return;

        if (matches || (parentId && childMatches)) {
          var gn = {
            id: node.id,
            title: node.title,
            type: node.type,
            typeKey: typeKey,
            state: node.state,
            assignedTo: node.assignedTo || '',
            url: node.url || '',
            level: level,
            children: node.children || [],
            y: 0,
            height: NODE_HEIGHT
          };
          allNodes.push(gn);
          idToNode[node.id] = gn;
          if (parentId && idToNode[parentId]) {
            edges.push({ from: parentId, to: node.id, fromType: parentType, toType: typeKey });
          }
        }

        if (node.children && node.children.length > 0) {
          flatten(node.children, matches ? node.id : parentId, level + 1, typeKey);
        }
      });
    }

    flatten(window.EPIC_TREE_DATA || [], null, 0, '');

    if (allNodes.length === 0) {
      var msg = search ? 'No items match your filter.' : 'No data to display.';
      var emptyEl = document.createElement('div');
      emptyEl.id = 'emptyState';
      emptyEl.className = 'empty-state';
      emptyEl.style.display = '';
      emptyEl.innerHTML = '<p>' + escapeHtml(msg) + '</p>';
      container.appendChild(emptyEl);
      return;
    }

    // Group nodes by level
    var maxLevel = 0;
    allNodes.forEach(function(n) { if (n.level > maxLevel) maxLevel = n.level; });

    var columns = [];
    for (var i = 0; i <= maxLevel; i++) columns.push([]);
    allNodes.forEach(function(n) { columns[n.level].push(n); });

    // Assign Y positions
    var maxColHeight = 0;
    columns.forEach(function(col) {
      var y = PAD_TOP;
      col.forEach(function(node) {
        node.y = y;
        y += node.height + NODE_GAP;
      });
      if (y > maxColHeight) maxColHeight = y;
    });

    // Calculate total width & column X offsets
    var colWidth = 270;
    var totalWidth = columns.length * colWidth + PAD_LEFT * 2;

    // Build canvas
    var canvas = document.createElement('div');
    canvas.className = 'graph-canvas';
    canvas.style.width = totalWidth + 'px';
    canvas.style.height = (maxColHeight + 20) + 'px';

    // SVG layer for edges
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'graph-svg');
    svg.setAttribute('width', totalWidth);
    svg.setAttribute('height', maxColHeight + 20);

    var EDGE_CLASS = {
      'epic_feature': 'edge-epic-feature',
      'epic_user-story': 'edge-epic-leaf',
      'epic_bug': 'edge-epic-leaf',
      'feature_user-story': 'edge-feature-leaf',
      'feature_bug': 'edge-feature-leaf'
    };

    edges.forEach(function(edge) {
      var from = idToNode[edge.from];
      var to = idToNode[edge.to];
      if (!from || !to) return;

      var x1 = PAD_LEFT + from.level * colWidth + colWidth - 10;
      var y1 = from.y + from.height / 2;
      var x2 = PAD_LEFT + to.level * colWidth - 10;
      var y2 = to.y + to.height / 2;

      var line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', x1);
      line.setAttribute('y1', y1);
      line.setAttribute('x2', x2);
      line.setAttribute('y2', y2);
      var ek = edge.fromType.replace(/\s+/g, '-').toLowerCase() + '_' + edge.toType;
      line.setAttribute('class', EDGE_CLASS[ek] || '');
      svg.appendChild(line);

      // Arrow marker on the right end
      var arrow = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      var angle = Math.atan2(y2 - y1, x2 - x1);
      var ax = x2 - 6 * Math.cos(angle);
      var ay = y2 - 6 * Math.sin(angle);
      var size = 4;
      var points = [
        x2 + ',' + y2,
        (ax - size * Math.sin(angle)) + ',' + (ay + size * Math.cos(angle)),
        (ax + size * Math.sin(angle)) + ',' + (ay - size * Math.cos(angle))
      ].join(' ');
      arrow.setAttribute('points', points);
      arrow.setAttribute('fill', 'var(--border)');
      arrow.style.fill = '#4a4d55';
      svg.appendChild(arrow);
    });

    canvas.appendChild(svg);

    // Columns layer
    var colsDiv = document.createElement('div');
    colsDiv.className = 'graph-columns';

    var colLabels = ['Epics', 'Features', 'Stories / Bugs'];
    columns.forEach(function(col, levelIndex) {
      var colDiv = document.createElement('div');
      colDiv.className = 'graph-col';
      colDiv.style.width = colWidth + 'px';
      colDiv.style.paddingLeft = (levelIndex === 0 ? PAD_LEFT : 0) + 'px';

      if (levelIndex < colLabels.length) {
        var header = document.createElement('div');
        header.className = 'graph-col-header';
        header.textContent = colLabels[levelIndex];
        if (levelIndex === columns.length - 1 && columns.length > colLabels.length) {
          header.textContent = '...';
        }
        colDiv.appendChild(header);
      }

      col.forEach(function(node) {
        var typeKey = node.typeKey;
        var isBug = typeKey === 'bug';
        var classes = 'graph-node ' + (typeKey === 'user-story' || isBug ? 'leaf' : typeKey);
        if (isBug) classes += ' bug-node';

        var nodeEl = document.createElement('div');
        nodeEl.className = classes;
        nodeEl.style.position = 'absolute';
        nodeEl.style.left = (PAD_LEFT + levelIndex * colWidth) + 'px';
        nodeEl.style.top = node.y + 'px';
        nodeEl.style.width = (colWidth - (levelIndex === 0 ? PAD_LEFT + 8 : 8)) + 'px';

        var typeLabels = { 'epic': 'E', 'feature': 'F', 'user-story': 'US', 'bug': 'B' };

        var headerDiv = document.createElement('div');
        headerDiv.className = 'graph-node-header';

        var badge = document.createElement('span');
        badge.className = 'type-badge type-' + typeKey;
        badge.textContent = typeLabels[typeKey] || node.type[0];
        headerDiv.appendChild(badge);

        var idSpan = document.createElement('span');
        idSpan.className = 'wi-id';
        idSpan.textContent = '#' + node.id;
        headerDiv.appendChild(idSpan);

        nodeEl.appendChild(headerDiv);

        var titleDiv = document.createElement('div');
        titleDiv.className = 'graph-node-title';
        titleDiv.textContent = node.title;
        titleDiv.title = node.title;
        nodeEl.appendChild(titleDiv);

        var footerDiv = document.createElement('div');
        footerDiv.className = 'graph-node-footer';

        var stateSpan = document.createElement('span');
        var stateKey = 'state-' + node.state.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z-]/g, '');
        stateSpan.className = 'state-badge ' + stateKey;
        stateSpan.textContent = node.state;
        footerDiv.appendChild(stateSpan);

        if (node.assignedTo) {
          var assignedSpan = document.createElement('span');
          assignedSpan.className = 'assigned-to';
          assignedSpan.textContent = node.assignedTo;
          assignedSpan.title = node.assignedTo;
          footerDiv.appendChild(assignedSpan);
        }

        if (node.url) {
          var link = document.createElement('a');
          link.className = 'graph-link';
          link.href = node.url;
          link.target = '_blank';
          link.rel = 'noopener';
          link.textContent = 'Open';
          link.title = 'Open in Azure DevOps';
          link.onclick = function(e) { e.stopPropagation(); };
          footerDiv.appendChild(link);
        }

        nodeEl.appendChild(footerDiv);
        canvas.appendChild(nodeEl);
      });
    });

    container.appendChild(canvas);
  }

  function nodeMatchesSearch(node, search) {
    if (!search) return true;
    if (node.title.toLowerCase().indexOf(search) !== -1) return true;
    if (('#' + node.id).indexOf(search) !== -1) return true;
    if (node.state.toLowerCase().indexOf(search) !== -1) return true;
    return false;
  }

  function getSearch() {
    return (document.getElementById('searchInput').value || '').toLowerCase().trim();
  }

  function escapeHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // ── File loader ──────────────────────────────────────────

  window.loadFromFile = function(event) {
    var file = event.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
      try {
        var tree = JSON.parse(e.target.result);
        if (!Array.isArray(tree)) throw new Error('Invalid format');
        window.EPIC_TREE_DATA = tree;
        document.getElementById('fileLoader').style.display = 'none';
        document.getElementById('toolbar').style.display = 'flex';
        document.getElementById('summary').style.display = 'flex';
        document.getElementById('legend').style.display = 'flex';
        if (!document.getElementById('viewToggle').querySelector('.active')) {
          setupViewToggle();
        }
        updateSummary();
        renderCurrentView();
      } catch (err) {
        alert('Failed to parse JSON: ' + err.message);
      }
    };
    reader.readAsText(file);
  };

})();
</script>

</body>
</html>
